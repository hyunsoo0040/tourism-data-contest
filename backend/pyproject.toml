[project]
name = "itda"
version = "0.1.0"
description = "Explainable Gyeongju travel-experience profiles and recommendations"
requires-python = ">=3.13.14,<3.14"
dependencies = [
  "ImageHash==4.3.2",
  "Pillow==12.3.0",
  "alembic==1.18.5",
  "fastapi==0.139.2",
  "httpx==0.28.1",
  "huggingface-hub==1.26.0",
  "numpy==2.5.1",
  "psycopg[binary,pool]==3.3.4",
  "pyarrow==25.0.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "scikit-learn==1.9.0",
  "scipy==1.18.0",
  "sqlalchemy==2.0.51",
  "sentence-transformers==5.6.0",
  "tenacity==9.1.4",
  "torch==2.13.0",
  "transformers==5.14.1",
  "uvicorn==0.51.0",
]

[dependency-groups]
dev = [
  "krippendorff==0.8.2",
  "mypy==2.3.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.15.22",
]
observability = [
  "arize-phoenix==19.13.0",
  "opentelemetry-sdk==1.44.0",
]
tooling = [
  "dvc==3.67.1",
]

[build-system]
requires = ["uv_build==0.11.28"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["itda"]
